name: "Documentation"

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
  schedule:
    - cron: '57 0 * * 5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch || github.ref != 'refs/tags/v*' }}

jobs:
  build-and-deploy-docs:
    name: "Documentation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Setup Julia"
        uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      - uses: julia-actions/cache@v3
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Install Dependencies"
        run: |
          julia --project=docs/ -e '
            using Pkg
            # Catalyst v16.2.1; later commits require SciMLBase 3, which EarthSciMLBase does not support yet.
            Pkg.add(PackageSpec(url="https://github.com/SciML/Catalyst.jl", rev="deb00ddd9b9532370a1b6569c3b6a34d86b2f19c"))
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'

      - name: "Build and Deploy Documentation"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          JULIA_NO_VERIFY_HOSTS: 'gaftp.epa.gov'
        run: julia --project=docs/ --code-coverage=user docs/make.jl

      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: "src,ext"

      - name: "Report Coverage with Codecov"
        uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          flags: "docs"
          token: "${{ secrets.CODECOV_TOKEN }}"
          fail_ci_if_error: true
